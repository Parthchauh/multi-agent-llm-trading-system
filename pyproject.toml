[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.2.3"
description = "LLM-assisted strategy research and deterministic backtesting workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.0",
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=1.0.10",
    "numpy>=1.26.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pydantic>=2.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "rank-bm25>=0.2.2",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=83.0.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]
audit = [
    "mypy>=1.15.0",
    "pip-audit>=2.9.0",
    "cyclonedx-bom>=5.0.0",
    "bandit>=1.8.0",
    "detect-secrets>=1.5.0",
]

[project.scripts]
tradingagents = "cli.research:app"
tradingagents-legacy = "cli.main:app"
trading-research = "cli.research:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "strategies*", "backtesting*", "data*", "regime*", "evaluation*", "risk*", "research_validation*", "paper_trading*", "research_dashboard*", "research_service*", "scripts*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: marks tests requiring live network access (deselect with -m 'not live')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# Security floors from the recorded 22 October 2026 dependency audit.
# Transitive constraints prevent a future resolution from restoring known vulnerable versions.
[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "certifi>=2026.10.19",
    "cryptography>=50.0.0",
    "curl-cffi>=0.15.0",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.4.4",
    "lxml>=6.1.0",
    "orjson>=3.11.6",
    "protobuf>=6.33.5",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "soupsieve>=2.9.0",
    "urllib3>=2.8.0",
]

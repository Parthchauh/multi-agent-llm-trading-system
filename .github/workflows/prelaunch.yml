name: Prelaunch verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.3
      - run: uv sync --locked --extra dev --extra audit --no-editable
      - run: uv run --locked --no-sync python -m scripts.verify_prelaunch --output verification-output --online-audit
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: verification-python-${{ matrix.python }}
          path: |
            verification-output/*.txt
            verification-output/*.json
            verification-output/fixture/fixture_result.json
          if-no-files-found: error
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: docker build --tag research-prelaunch:verification .
      - run: docker run --rm --network none --read-only --tmpfs /tmp research-prelaunch:verification --help
      - run: docker run --rm --network none --read-only --tmpfs /tmp --entrypoint python research-prelaunch:verification -m tests.prelaunch_fixture --output /tmp/recorded-e2e
      - run: docker image inspect research-prelaunch:verification --format '{{.Id}}'
      - run: docker image inspect research-prelaunch:verification --format '{{.Id}}' > container-digest.txt
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: research-prelaunch:verification
          format: json
          output: container-scan.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: container-evidence
          path: |
            container-digest.txt
            container-scan.json
          if-no-files-found: error
          retention-days: 14
